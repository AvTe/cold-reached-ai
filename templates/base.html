<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdReached AI - Outreach Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white h-screen border-r border-gray-200 sticky top-0">
        <div class="px-6 py-8">
            <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center">
                <i data-lucide="zap" class="w-6 h-6 text-blue-600 mr-2"></i>
                ColdReached
            </h2>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold flex items-center">
                <i data-lucide="cpu" class="w-3 h-3 mr-1"></i>
                AI Outreach Tool
            </p>
        </div>
        
        <nav class="mt-4 px-4 space-y-1">
            <a href="/" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 hover:bg-blue-50 hover:text-blue-600 group">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500"></i>
                Dashboard / Scrape
            </a>
            <a href="/businesses" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 hover:bg-blue-50 hover:text-blue-600 group">
                <i data-lucide="briefcase" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500"></i>
                Businesses List
            </a>
            <a href="/preview" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 hover:bg-blue-50 hover:text-blue-600 group">
                <i data-lucide="mail" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500"></i>
                Email Preview
            </a>
            <a href="/logs" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 hover:bg-blue-50 hover:text-blue-600 group">
                <i data-lucide="scroll-text" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500"></i>
                Send Log
            </a>
            <a href="/settings" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 hover:bg-blue-50 hover:text-blue-600 group">
                <i data-lucide="settings" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-blue-500"></i>
                Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto h-screen p-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
