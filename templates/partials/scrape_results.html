<div class="bg-white rounded-3xl shadow-xl shadow-gray-100 border border-gray-100 overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
    <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <div>
            <h3 class="text-lg font-bold text-gray-900">Extraction Result</h3>
            <p class="text-sm text-gray-500">{{ message }}</p>
        </div>
        <a href="/businesses" class="px-4 py-2 bg-white border border-gray-200 text-gray-600 text-xs font-bold rounded-xl hover:border-blue-500 hover:text-blue-600 transition-all flex items-center">
            <i data-lucide="list" class="w-3 h-3 mr-2"></i>
            View Full List
        </a>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50/50 text-[10px] font-black uppercase tracking-widest text-gray-400">
                <tr>
                    <th class="px-8 py-4">Business Name</th>
                    <th class="px-8 py-4">Phone</th>
                    <th class="px-8 py-4">Website</th>
                    <th class="px-8 py-4 text-center">Rating</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for b in businesses %}
                <tr class="hover:bg-blue-50/30 transition-colors">
                    <td class="px-8 py-5">
                        <div class="text-sm font-bold text-gray-900">{{ b.name }}</div>
                        <div class="text-[10px] text-gray-400 mt-1 truncate max-w-xs">{{ b.address }}</div>
                    </td>
                    <td class="px-8 py-5 text-sm text-gray-600 font-medium">
                        {{ b.phone or 'N/A' }}
                    </td>
                    <td class="px-8 py-5">
                        {% if b.website %}
                        <a href="{{ b.website }}" target="_blank" class="text-blue-600 hover:text-blue-700">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                        </a>
                        {% else %}
                        <span class="text-gray-300">—</span>
                        {% endif %}
                    </td>
                    <td class="px-8 py-5 text-center">
                        <div class="inline-flex items-center px-2 py-1 bg-yellow-50 text-yellow-700 rounded-lg text-xs font-bold border border-yellow-100">
                            <i data-lucide="star" class="w-3 h-3 mr-1 fill-yellow-400 text-yellow-400"></i>
                            {{ b.rating }}
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <div class="p-8 bg-gray-50/30 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-500 mb-4">Step 2: Scan these websites for contact emails.</p>
        <button hx-post="/find-emails" hx-target="#scrape-result" hx-indicator="#loading"
                class="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 transition-all flex items-center mx-auto">
            <i data-lucide="search" class="w-4 h-4 mr-2"></i>
            Find Emails for These Leads
        </button>
    </div>
</div>

<script>
    // Refresh Lucide icons for the new content
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
